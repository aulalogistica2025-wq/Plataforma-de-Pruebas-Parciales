<script>
/* =========================================================================
   CONFIGURACIÓN DE FIREBASE
   =========================================================================
   Esta app necesita una base de datos compartida en la nube para que las
   pruebas creadas por el docente y las respuestas de los estudiantes se
   guarden en el mismo lugar (no solo en el navegador de cada persona).

   Firebase (Google) ofrece un plan gratuito ("Spark") más que suficiente
   para un curso universitario. Sigue los pasos del README.md para crear
   tu proyecto y reemplaza los valores de abajo por los tuyos.

   Mientras dejes "TU_API_KEY" sin cambiar, la aplicación funcionará en
   "modo local de prueba": los datos solo se guardan en el navegador
   actual y NO se comparten entre docente y estudiantes. Sirve para
   probar la interfaz, pero no para aplicar pruebas reales.
   ========================================================================= */

window.FIREBASE_CONFIG = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxxxx"
};

</script>
<script>
/* =========================================================================
   ADAPTADOR DE ALMACENAMIENTO
   =========================================================================
   Provee window.storage.{get,set,delete,list} con la misma firma que usa
   la aplicación (key, shared) para que index.html no necesite cambios.

   - Si assets/firebase-config.js tiene llaves reales -> usa Firestore
     (compartido entre todos los usuarios: docente y estudiantes).
   - Si no -> usa localStorage del navegador (modo local de prueba,
     NO compartido entre dispositivos/personas).
   ========================================================================= */
(function(){
  const cfg = window.FIREBASE_CONFIG || {};
  const LS_PREFIX = 'pruebas_logistica__';
  let db = null;
  let useFirebase = false;

  if(cfg.apiKey && cfg.apiKey !== 'TU_API_KEY' && window.firebase){
    try{
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      useFirebase = true;
    }catch(e){
      console.error('No se pudo inicializar Firebase, usando modo local.', e);
    }
  }
  window.STORAGE_MODE = useFirebase ? 'firebase' : 'local';

  async function fbGet(key){
    const doc = await db.collection('storage').doc(key).get();
    return doc.exists ? { key, value: doc.data().value } : null;
  }
  async function fbSet(key, value){
    await db.collection('storage').doc(key).set({ value, updated: Date.now() });
    return { key, value };
  }
  async function fbDelete(key){
    await db.collection('storage').doc(key).delete();
    return { key, deleted: true };
  }
  async function fbList(prefix){
    // Nota: en un curso pequeño esto es suficiente. Para volúmenes grandes,
    // conviene indexar por colección/subcolección en vez de filtrar en cliente.
    const snap = await db.collection('storage').get();
    const keys = [];
    snap.forEach(d => { if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
    return { keys };
  }

  function lsGet(key){
    const v = localStorage.getItem(LS_PREFIX + key);
    return v != null ? { key, value: v } : null;
  }
  function lsSet(key, value){
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  }
  function lsDelete(key){
    localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  }
  function lsList(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k.startsWith(LS_PREFIX)){
        const real = k.slice(LS_PREFIX.length);
        if(!prefix || real.startsWith(prefix)) keys.push(real);
      }
    }
    return { keys };
  }

  window.storage = {
    async get(key, _shared){
      try{ return useFirebase ? await fbGet(key) : lsGet(key); }
      catch(e){ console.error('storage.get', e); return null; }
    },
    async set(key, value, _shared){
      try{ return useFirebase ? await fbSet(key, value) : lsSet(key, value); }
      catch(e){ console.error('storage.set', e); return null; }
    },
    async delete(key, _shared){
      try{ return useFirebase ? await fbDelete(key) : lsDelete(key); }
      catch(e){ console.error('storage.delete', e); return null; }
    },
    async list(prefix, _shared){
      try{ return useFirebase ? await fbList(prefix) : lsList(prefix); }
      catch(e){ console.error('storage.list', e); return { keys: [] }; }
    }
  };

  document.addEventListener('DOMContentLoaded', function(){
    if(!useFirebase){
      const b = document.createElement('div');
      b.style.cssText = 'background:#B3382C;color:#fff;text-align:center;padding:9px 14px;'
        + 'font:600 12.5px Inter,sans-serif;letter-spacing:.01em;position:relative;z-index:9999;';
      b.textContent = '⚠ Modo local de prueba: los datos solo se guardan en este navegador y no se comparten entre docente y estudiantes. Configura Firebase (ver README.md) antes de aplicar pruebas reales.';
      document.body.prepend(b);
    }
  });
})();

<div id="app"></div>

<script>
/* =========================================================================
   MANIFIESTO DE EVALUACIÓN — Pruebas Cortas y Parcial Integrador
   Asignatura: Logística Internacional — Universidad de Panamá / CRUV
   ========================================================================= */

const APP = {
  view: 'home',
  ctx: {},          // datos temporales de navegación
  docenteAuth: false,
};

const PIN_DOCENTE = 'CRUV-2026'; // PIN de acceso al panel docente

const ENCABEZADO = {
  linea1: 'Universidad de Panamá',
  linea2: 'Centro Regional Universitario de Veraguas',
  linea3: 'Facultad de Administración de Empresas y Contabilidad',
  linea4: 'Licenciatura en Ingeniería de Operaciones y Logística Empresarial',
  linea5: 'Asignatura: Logística Internacional'
};

/* ---------------------------- almacenamiento ---------------------------- */
async function stGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function stSet(key, value){
  try{ const r = await window.storage.set(key, JSON.stringify(value), true); return !!r; }
  catch(e){ console.error('storage set error', e); return false; }
}
async function stList(prefix){
  try{ const r = await window.storage.list(prefix, true); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function stDelete(key){
  try{ await window.storage.delete(key, true); }catch(e){}
}

/* --------------------------------- utils --------------------------------- */
function uid(n=6){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genCodigo(modulo){
  const pre = (modulo||'LOG').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'LOG';
  return pre + '-' + uid(5);
}
function hashSeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h>>>0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffleSeeded(arr, seedStr){
  const rnd = mulberry32(hashSeed(seedStr));
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){ return new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normText(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}

/* ---------------------- parser de documento de preguntas ---------------------- */
// Formato admitido (texto plano, separado por bloques):
// MODULO: ...
// TIPO: prueba_corta | parcial
// INSTRUCCIONES: ...
// PREGUNTA: ...
// TIPO_PREGUNTA: seleccion | vf | corta
// PUNTOS: 10        (opcional)
// OPCION: ...        (solo para seleccion, repetir por cada opción)
// RESPUESTA: ...
function parseDocumento(text){
  const lines = text.split(/\r?\n/);
  const meta = { modulo:'', tipoPrueba:'prueba_corta', instrucciones:'' };
  const preguntas = [];
  let cur = null;

  function pushCur(){
    if(cur && cur.texto){ preguntas.push(cur); }
    cur = null;
  }

  for(let raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const m = line.match(/^([A-Za-zÁÉÍÓÚÑ_]+)\s*:\s*(.*)$/);
    if(!m){ continue; }
    const key = m[1].toUpperCase();
    const val = m[2].trim();
    switch(key){
      case 'MODULO': meta.modulo = val; break;
      case 'TIPO':
        meta.tipoPrueba = /parcial/i.test(val) ? 'parcial' : 'prueba_corta';
        break;
      case 'INSTRUCCIONES': meta.instrucciones = val; break;
      case 'PREGUNTA':
        pushCur();
        cur = { id: uid(8), texto: val, tipo:'seleccion', puntos:null, opciones:[], respuesta:'' };
        break;
      case 'TIPO_PREGUNTA':
        if(cur){
          const v = val.toLowerCase();
          cur.tipo = v.startsWith('v') ? 'vf' : (v.startsWith('c') ? 'corta' : 'seleccion');
        }
        break;
      case 'PUNTOS':
        if(cur) cur.puntos = parseFloat(val) || null;
        break;
      case 'OPCION':
        if(cur) cur.opciones.push(val);
        break;
      case 'RESPUESTA':
        if(cur) cur.respuesta = val;
        break;
      default: break;
    }
  }
  pushCur();

  // normalizar V/F opciones
  preguntas.forEach(p=>{
    if(p.tipo==='vf'){ p.opciones = ['Verdadero','Falso']; }
  });

  return { meta, preguntas };
}

function repartirPuntos(preguntas){
  const conPuntos = preguntas.filter(p=>p.puntos);
  const sinPuntos = preguntas.filter(p=>!p.puntos);
  let usados = conPuntos.reduce((a,p)=>a+p.puntos,0);
  if(sinPuntos.length){
    const restante = Math.max(0, 100 - usados);
    const cada = Math.round((restante / sinPuntos.length) * 100) / 100;
    sinPuntos.forEach((p,i)=>{ p.puntos = (i===sinPuntos.length-1) ? Math.round((restante - cada*(sinPuntos.length-1))*100)/100 : cada; });
  }
  return preguntas;
}

/* ------------------------------- calificación ------------------------------- */
function evaluarRespuesta(pregunta, respuestaEstudiante){
  if(pregunta.tipo==='corta'){
    return normText(respuestaEstudiante) !== '' && normText(respuestaEstudiante) === normText(pregunta.respuesta)
      ? true
      : (normText(pregunta.respuesta).length>0 && normText(respuestaEstudiante).includes(normText(pregunta.respuesta)));
  }
  return normText(respuestaEstudiante) === normText(pregunta.respuesta);
}

    try{
      let text = '';

        const result = await mammoth.extractRawText({arrayBuffer: buf});

      } else if(/\.txt$/i.test(file.name)){

    if(resumen){
      resumen.textContent = d.preguntas.length
        ? `${d.preguntas.length} pregunta(s) · puntos asignados: ${totalPuntos || 'se repartirán 100 pts automáticamente'}`
        : '';
    }
  }

  function QEditorHTML(p,i){
    return `<div class="q-editor" data-qi="${i}">
      <div class="row-top">
        <span class="idx">PREGUNTA ${String(i+1).padStart(2,'0')}</span>
        <button class="small-x" data-del="${i}">✕ eliminar</button>
      </div>
      <label class="field-label">Enunciado</label>
      <textarea data-f="texto" style="font-family:'Inter',sans-serif; min-height:50px;" placeholder="Escriba la pregunta...">${esc(p.texto)}</textarea>
      <div class="grid2" style="margin-top:10px;">
        <div>
          <label class="field-label">Tipo</label>
          <select data-f="tipo">
            <option value="seleccion" ${p.tipo==='seleccion'?'selected':''}>Selección múltiple</option>
            <option value="vf" ${p.tipo==='vf'?'selected':''}>Verdadero / Falso</option>
            <option value="corta" ${p.tipo==='corta'?'selected':''}>Respuesta corta</option>
          </select>
        </div>
        <div>
          <label class="field-label">Puntos (opcional)</label>
          <input type="number" min="0" step="0.5" data-f="puntos" value="${p.puntos||''}" placeholder="auto">
        </div>
      </div>
      <div data-opts style="margin-top:10px;"></div>
      <div style="margin-top:10px;">
        <label class="field-label">Respuesta correcta</label>
        ${p.tipo==='vf'
          ? `<select data-f="respuesta">
               <option value="Verdadero" ${p.respuesta==='Verdadero'?'selected':''}>Verdadero</option>
               <option value="Falso" ${p.respuesta==='Falso'?'selected':''}>Falso</option>
             </select>`
          : `<input type="text" data-f="respuesta" value="${esc(p.respuesta)}" placeholder="${p.tipo==='corta'?'Texto esperado de la respuesta':'Debe coincidir con una de las opciones'}">`}
      </div>
    </div>`;
  }

  function bindQEditor(p,i){
    const box = document.querySelector(`.q-editor[data-qi="${i}"]`);
    if(!box) return;
    box.querySelector('[data-del]').onclick = ()=>{ d.preguntas.splice(i,1); renderListaPreguntas(); };
    box.querySelector('[data-f="texto"]').oninput = e=> p.texto = e.target.value;
    box.querySelector('[data-f="puntos"]').oninput = e=> p.puntos = parseFloat(e.target.value)||null;
    box.querySelector('[data-f="tipo"]').onchange = e=>{ p.tipo = e.target.value; if(p.tipo==='vf'){p.opciones=['Verdadero','Falso']; p.respuesta='Verdadero';} else if(p.tipo==='seleccion' && p.opciones.length<2){ p.opciones=['','']; } else if(p.tipo==='corta'){p.respuesta='';} renderListaPreguntas(); };
    const respField = box.querySelector('[data-f="respuesta"]');
    if(respField) respField.addEventListener(respField.tagName==='SELECT'?'change':'input', e=> p.respuesta = e.target.value);

    const optsBox = box.querySelector('[data-opts]');
    if(p.tipo==='seleccion'){
      optsBox.innerHTML = `<label class="field-label">Opciones</label>` +
        p.opciones.map((o,oi)=>`
          <div class="opt-edit-row">
            <input type="text" data-opt="${oi}" value="${esc(o)}" placeholder="Opción ${oi+1}">
            <button class="small-x" data-optdel="${oi}">✕</button>
          </div>`).join('') +
        `<button class="btn btn-ghost btn-sm" data-optadd style="margin-top:4px;">+ opción</button>`;
      optsBox.querySelectorAll('[data-opt]').forEach(inp=>{
        inp.oninput = e=>{ p.opciones[+inp.getAttribute('data-opt')] = e.target.value; };
      });
      optsBox.querySelectorAll('[data-optdel]').forEach(btn=>{
        btn.onclick = ()=>{ p.opciones.splice(+btn.getAttribute('data-optdel'),1); renderListaPreguntas(); };
      });
      const addBtn = optsBox.querySelector('[data-optadd]');
      if(addBtn) addBtn.onclick = ()=>{ p.opciones.push(''); renderListaPreguntas(); };
    } else {
      optsBox.innerHTML = '';
    }
  }

  async function generarPrueba(){
    const errs = [];
    if(!d.modulo.trim()) errs.push('Indique el módulo.');
    if(!d.preguntas.length) errs.push('Agregue al menos una pregunta.');
    d.preguntas.forEach((p,i)=>{
      if(!p.texto.trim()) errs.push(`La pregunta ${i+1} no tiene enunciado.`);
      if(!p.respuesta || !String(p.respuesta).trim()) errs.push(`La pregunta ${i+1} no tiene respuesta correcta definida.`);
      if(p.tipo==='seleccion'){
        const opts = p.opciones.filter(o=>o.trim());
        if(opts.length<2) errs.push(`La pregunta ${i+1} necesita al menos 2 opciones.`);
        else if(!opts.some(o=>normText(o)===normText(p.respuesta))) errs.push(`La respuesta de la pregunta ${i+1} debe coincidir con una de sus opciones.`);
      }
    });
    if(errs.length){
      alert('Revise lo siguiente antes de generar la prueba:\n\n- ' + errs.join('\n- '));
      return;
    }
    const preguntasFinal = repartirPuntos(d.preguntas.map(p=>({...p, opciones: p.opciones ? p.opciones.filter(o=>o.trim()) : []})));
    const test = {
      id: uid(10),
      modulo: d.modulo.trim(),
      titulo: d.titulo.trim() || d.modulo.trim(),
      tipoPrueba: d.tipoPrueba,
      instrucciones: d.instrucciones.trim(),
      preguntas: preguntasFinal,
      valorTotal: 100,
      codigo: genCodigo(d.modulo),
      creado: Date.now(),
      activo: true,
    };
    const btn = document.getElementById('btnGenerar');
    if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
    const guardado = await stSet('test:'+test.id, test);
    if(!guardado){
      if(btn){ btn.disabled = false; btn.textContent = 'Generar prueba y código de acceso'; }
      alert('No se pudo guardar la prueba en el almacenamiento.\n\nEsto suele pasar cuando el archivo se abre directamente con doble clic (file://) en navegadores con políticas de privacidad o empresariales estrictas.\n\nSoluciones:\n1) Abra la app mediante un servidor local (por ejemplo "python -m http.server" y luego http://localhost:8000) en vez de doble clic.\n2) O configure Firebase (ver README.md) y pruebe la app ya publicada en su sitio — es la forma recomendada para uso real con estudiantes.');
      return;
    }
    APP.ctx.draft = null;
    APP.ctx.testId = test.id;
    APP.ctx.nuevoCodigo = test.codigo;
    APP.view='docenteReporte';
    render();
  }

  return wrap;
}

            <th>Estudiante</th><th>Cédula</th><th>Fecha</th><th>Inicio</th><th>Fin</th>

              <tr>
                <td><b>${esc(a.nombre)}</b></td>
                <td class="mono">${esc(a.cedula)}</td>
                <td>${esc(a.fecha)}</td>
                <td class="mono">${esc(a.horaInicio||'—')}</td>
                <td class="mono">${esc(a.horaFin||'—')}</td>
                <td>${a.duracionSeg!=null ? fmtDuration(a.duracionSeg) : '—'}</td>
                <td><b>${a.estado==='finalizado' ? (a.calificacion!=null?a.calificacion.toFixed(1):'—') : (a.estado==='anulado' ? '0.0' : '—')}</b> / 100</td>
                <td>${a.estado==='finalizado' ? '<span class="badge ok">Finalizado</span>' : a.estado==='anulado' ? '<span class="badge bad">Anulado</span>' : '<span class="badge progress">En curso</span>'}</td>

function EstadisticasHTML(intentos){
  const finalizados = intentos.filter(a=>a.estado==='finalizado');
  const anulados = intentos.filter(a=>a.estado==='anulado');
  const promedio = finalizados.length ? (finalizados.reduce((s,a)=>s+(a.calificacion||0),0)/finalizados.length) : 0;
  const durProm = finalizados.length ? (finalizados.reduce((s,a)=>s+(a.duracionSeg||0),0)/finalizados.length) : 0;
  return `
    <div class="grid2">
      <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">PROMEDIO DEL GRUPO</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${promedio.toFixed(1)} / 100</div></div>
      <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">TIEMPO PROMEDIO</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${fmtDuration(durProm)}</div></div>
    </div>
    <p class="muted" style="margin-top:12px;">${finalizados.length} finalizada(s) · ${anulados.length} anulada(s) por abandono de pantalla · ${intentos.length} intento(s) totales.</p>
  `;
}

function DetalleIntentoHTML(a, test){
  if(a.estado==='anulado'){
    return `<div class="notice danger">Intento anulado: ${esc(a.motivoAnulacion||'el estudiante salió de la aplicación durante la prueba.')}</div>`;
  }
  if(!a.respuestas) return `<p class="muted">Sin respuestas registradas (intento en curso).</p>`;
  return `<table class="report" style="margin-top:6px;">
    <thead><tr><th>Pregunta</th><th>Respuesta del estudiante</th><th>Correcta</th><th>Puntos</th><th>Tiempo usado</th></tr></thead>
    <tbody>
    ${a.respuestas.map(r=>{
      const preg = test.preguntas.find(p=>p.id===r.preguntaId);
      const correcta = preg ? evaluarRespuesta(preg, r.respuesta) : false;
      return `<tr>
        <td>${esc(preg?preg.texto:'—')}</td>
        <td>${esc(r.respuesta||'(sin responder)')}</td>
        <td>${correcta?'<span class="badge ok">✓</span>':'<span class="badge bad">✗</span>'}</td>
        <td>${correcta?(preg.puntos||0):0} / ${preg?preg.puntos:0}</td>
        <td class="mono">${fmtDuration(r.tiempoSegundos||0)}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

function ViewEstAcceso(){
  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader());
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='480px';
  const prellenado = APP.ctx.codigoPrellenado || '';
  shell.innerHTML = `
    <div class="card">
      <span class="section-label">Acceso del estudiante</span>
      <h2 style="font-size:20px; margin-bottom:14px;">Ingrese el código de la prueba</h2>
      <p class="muted" style="margin-bottom:16px;">Escriba el código de acceso único compartido por su docente para esta prueba.</p>
      <label class="field-label">Código de acceso</label>
      <input type="text" id="codigoInput" class="mono" style="text-transform:uppercase;" placeholder="EJ: LOG-4F7K2" value="${esc(prellenado)}">
      <div id="codeError" class="notice danger" style="display:none; margin-top:10px;"></div>
      <button class="btn btn-primary btn-block" id="btnAcceder" style="margin-top:16px;">Continuar</button>
    </div>
  `;
  wrap.appendChild(shell);
  setTimeout(()=>{
    const input = document.getElementById('codigoInput');
    const tryAccess = async ()=>{
      const codigo = input.value.trim().toUpperCase();
      if(!codigo) return;
      const keys = await stList('test:');
      const tests = (await Promise.all(keys.map(k=>stGet(k)))).filter(Boolean);
      const test = tests.find(t=>t.codigo===codigo);
      const errBox = document.getElementById('codeError');
      if(!test){
        errBox.style.display='block';
        errBox.textContent='El código ingresado no corresponde a ninguna prueba activa. Verifique con su docente.';
        return;
      }
      APP.ctx.test = test;
      APP.view='estDatos';
      render();
    };
    document.getElementById('btnAcceder').onclick = tryAccess;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAccess(); });
    if(prellenado) tryAccess();
  });
  return wrap;
}

function ViewEstDatos(){
  const test = APP.ctx.test;
  if(!test){ APP.view='estAcceso'; setTimeout(render); return document.createElement('div'); }
  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader(test.titulo));
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='560px';
  shell.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <span class="section-label" style="margin-bottom:0;">${test.tipoPrueba==='parcial'?'Parcial Integrador':'Prueba Corta'} · ${esc(test.modulo)}</span>
        <span class="pill">Valor: 100 pts</span>
      </div>
      <h2 style="font-size:19px; margin-top:8px;">${esc(test.titulo)}</h2>

      ${test.instrucciones ? `<div class="notice info" style="margin-top:14px;"><b>Instrucciones:</b> ${esc(test.instrucciones)}</div>` : ''}

      <div class="notice warn" style="margin-top:12px;">
        <b>Importante — integridad académica:</b>
        <ul>
          <li>Cuenta con un único intento para esta prueba.</li>
          <li>Si sale de esta pantalla o cambia de aplicación mientras la prueba está en curso, su examen se anulará automáticamente con calificación <b>0</b> y el código dejará de funcionar para usted, sin afectar a los demás estudiantes.</li>
          <li>Las preguntas y opciones se presentan en orden aleatorio.</li>
          <li>Al finalizar recibirá su calificación y retroalimentación de inmediato.</li>
        </ul>
      </div>

      <hr class="divider">
      <div class="grid2">
        <div>
          <label class="field-label">Nombre completo</label>
          <input type="text" id="fNombre" placeholder="Nombre y apellido">
        </div>
        <div>
          <label class="field-label">Cédula de identidad personal</label>
          <input type="text" id="fCedula" placeholder="Ej: 4-123-4567">
        </div>
      </div>
      <div style="margin-top:14px;">
        <label class="field-label">Fecha del examen</label>
        <input type="date" id="fFecha" value="${todayISO()}">
      </div>
      <div id="datosError" class="notice danger" style="display:none; margin-top:12px;"></div>
      <button class="btn btn-gold btn-block" id="btnEmpezar" style="margin-top:18px;">Comenzar prueba</button>
    </div>
  `;
  wrap.appendChild(shell);

  setTimeout(()=>{
    document.getElementById('btnEmpezar').onclick = async ()=>{
      const nombre = document.getElementById('fNombre').value.trim();
      const cedula = document.getElementById('fCedula').value.trim();
      const fecha = document.getElementById('fFecha').value;
      const errBox = document.getElementById('datosError');
      if(!nombre || !cedula || !fecha){
        errBox.style.display='block';
        errBox.textContent='Complete su nombre, cédula y fecha para continuar.';
        return;
      }
      const key = 'intento:'+test.id+':'+cedula;
      const existente = await stGet(key);
      if(existente){
        APP.ctx.intentoExistente = existente;
        APP.view = 'estBloqueado';
        render();
        return;
      }
      const now = Date.now();
      const intento = {
        testId: test.id, nombre, cedula, fecha,
        horaInicio: nowTimeStr(), horaInicioTs: now,
        horaFin: null, horaFinTs: null, duracionSeg: null,
        estado: 'en_progreso', calificacion: null, respuestas: [],
      };
      const guardado = await stSet(key, intento);
      if(!guardado){
        errBox.style.display='block';
        errBox.textContent='No se pudo registrar su intento (fallo de almacenamiento del navegador). Recargue la página e intente de nuevo; si persiste, avise a su docente.';
        return;
      }
      APP.ctx.intento = intento;
      APP.ctx.attemptKey = key;
      // orden aleatorio de preguntas y opciones, semilla estable por estudiante+prueba
      const seed = test.id + '|' + cedula;
      const preguntasOrdenadas = shuffleSeeded(test.preguntas, seed).map(p=>{
        if(p.tipo==='seleccion'){
          return {...p, opciones: shuffleSeeded(p.opciones, seed+'|'+p.id)};
        }
        return p;
      });
      APP.ctx.preguntas = preguntasOrdenadas;
      APP.ctx.qIndex = 0;
      APP.ctx.respuestasTemp = {};
      APP.ctx.tiemposTemp = {};
      APP.view = 'estPrueba';
      render();
    };
  });
  return wrap;
}

let ANTI_CHEAT_BOUND = false;
let ANTI_CHEAT_TRIGGERED = false;
let Q_START_TS = 0;

function ViewEstPrueba(){
  const test = APP.ctx.test;
  const preguntas = APP.ctx.preguntas;
  const idx = APP.ctx.qIndex;
  const pregunta = preguntas[idx];
  Q_START_TS = Date.now();
  ANTI_CHEAT_TRIGGERED = false;

  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader(test.titulo));
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='680px';

  const total = preguntas.length;
  const track = preguntas.map((p,i)=>{
    const state = i<idx ? 'done' : (i===idx ? 'active' : '');
    return `<div class="wp ${state}">${i+1}</div>` + (i<total-1 ? `<div class="seg ${i<idx?'done':''}"></div>` : '');
  }).join('');

  shell.innerHTML = `
    <div class="card" style="border-color:var(--gold); background:#FFFDF7;">
      <div class="flex-between">
        <div class="mono muted" style="font-size:12px;">${esc(APP.ctx.intento.nombre)} · C.I. ${esc(APP.ctx.intento.cedula)}</div>
        <div class="qtimer"><span class="led"></span> Prueba en curso — no cambie de pantalla</div>
      </div>
    </div>
    <div class="route-track">${track}</div>
    <div class="card">
      <span class="section-label">Pregunta ${idx+1} de ${total} · ${pregunta.puntos} pts</span>
      <h3 style="font-size:17px; margin-top:8px; line-height:1.5;">${esc(pregunta.texto)}</h3>
      <div id="answerArea" style="margin-top:18px;"></div>
      <div class="flex-between" style="margin-top:22px;">
        <button class="btn btn-ghost" id="btnPrev" ${idx===0?'disabled':''}>◂ Anterior</button>
        <button class="btn btn-primary" id="btnNext">${idx===total-1 ? 'Finalizar prueba' : 'Siguiente ▸'}</button>
      </div>
    </div>
  `;
  wrap.appendChild(shell);

  setTimeout(()=>{
    const area = document.getElementById('answerArea');
    const savedAnswer = APP.ctx.respuestasTemp[pregunta.id] || '';
    if(pregunta.tipo==='corta'){
      area.innerHTML = `<textarea id="respCorta" style="font-family:'Inter',sans-serif;" placeholder="Escriba su respuesta...">${esc(savedAnswer)}</textarea>`;
      document.getElementById('respCorta').oninput = e=> APP.ctx.respuestasTemp[pregunta.id]=e.target.value;
    } else {
      const letras = 'ABCDEFGH';
      area.innerHTML = pregunta.opciones.map((op,oi)=>`
        <div class="opt-row ${savedAnswer===op?'selected':''}" data-op="${oi}">
          <span class="letter">${letras[oi]}</span>
          <input type="radio" name="opt" ${savedAnswer===op?'checked':''} style="margin-top:4px;">
          <span>${esc(op)}</span>
        </div>`).join('');
      area.querySelectorAll('.opt-row').forEach(row=>{
        row.onclick=()=>{
          area.querySelectorAll('.opt-row').forEach(r=>{r.classList.remove('selected'); r.querySelector('input').checked=false;});
          row.classList.add('selected');
          row.querySelector('input').checked=true;
          const oi = +row.getAttribute('data-op');
          APP.ctx.respuestasTemp[pregunta.id] = pregunta.opciones[oi];
        };
      });
    }

    document.getElementById('btnPrev').onclick = ()=>{ registrarTiempo(pregunta); APP.ctx.qIndex--; render(); };
    document.getElementById('btnNext').onclick = async ()=>{
      registrarTiempo(pregunta);
      if(idx===total-1){
        await finalizarPrueba();
      } else {
        APP.ctx.qIndex++;
        render();
      }
    };
  });

  bindAntiCheat();
  return wrap;
}

function registrarTiempo(pregunta){
  const elapsed = (Date.now()-Q_START_TS)/1000;
  APP.ctx.tiemposTemp[pregunta.id] = (APP.ctx.tiemposTemp[pregunta.id]||0) + elapsed;
}

function bindAntiCheat(){
  if(ANTI_CHEAT_BOUND) return;
  ANTI_CHEAT_BOUND = true;
  const handleLeave = async ()=>{
    if(APP.view !== 'estPrueba') return;
    if(ANTI_CHEAT_TRIGGERED) return;
    ANTI_CHEAT_TRIGGERED = true;
    await anularPorAbandono();
  };
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) handleLeave(); });
  window.addEventListener('blur', handleLeave);
  window.addEventListener('beforeunload', (e)=>{
    if(APP.view==='estPrueba'){ e.preventDefault(); e.returnValue=''; }
  });
}

async function anularPorAbandono(){
  const intento = APP.ctx.intento;
  if(!intento || intento.estado!=='en_progreso') return;
  intento.estado='anulado';
  intento.calificacion=0;
  intento.motivoAnulacion='El estudiante salió de la aplicación o cambió de pantalla durante la prueba.';
  intento.horaFin = nowTimeStr();
  intento.horaFinTs = Date.now();
  intento.duracionSeg = (intento.horaFinTs - intento.horaInicioTs)/1000;
  await stSet(APP.ctx.attemptKey, intento);
  APP.view='estBloqueado';
  APP.ctx.intentoExistente = intento;
  render();
}

async function finalizarPrueba(){
  const test = APP.ctx.test;
  const intento = APP.ctx.intento;
  const respuestas = APP.ctx.preguntas.map(p=>({
    preguntaId: p.id,
    respuesta: APP.ctx.respuestasTemp[p.id] || '',
    tiempoSegundos: APP.ctx.tiemposTemp[p.id] || 0,
  }));
  let puntaje = 0;
  respuestas.forEach(r=>{
    const preg = test.preguntas.find(p=>p.id===r.preguntaId);
    if(preg && evaluarRespuesta(preg, r.respuesta)) puntaje += (preg.puntos||0);
  });
  intento.respuestas = respuestas;
  intento.calificacion = Math.round(puntaje*100)/100;
  intento.estado = 'finalizado';
  intento.horaFin = nowTimeStr();
  intento.horaFinTs = Date.now();
  intento.duracionSeg = (intento.horaFinTs - intento.horaInicioTs)/1000;
  await stSet(APP.ctx.attemptKey, intento);
  APP.ctx.intentoFinal = intento;
  APP.view='estResultado';
  render();
}

/* ===================================================================== */
/* VIEW: ESTUDIANTE — RESULTADO / RETROALIMENTACIÓN INMEDIATA            */
/* ===================================================================== */
function ViewEstResultado(){
  const test = APP.ctx.test;
  const intento = APP.ctx.intentoFinal;
  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader(test.titulo));
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='680px';

  const pct = Math.max(0, Math.min(100, intento.calificacion));
  const revisadas = test.preguntas.map(preg=>{
    const r = intento.respuestas.find(x=>x.preguntaId===preg.id) || {respuesta:''};
    const ok = evaluarRespuesta(preg, r.respuesta);
    return { preg, r, ok };
  });
  const nCorrectas = revisadas.filter(x=>x.ok).length;
  const nIncorrectas = revisadas.length - nCorrectas;

  shell.innerHTML = `
    <div class="card score-hero" id="printArea">
      <div class="ring" style="--pct:${pct};"><div class="inner"><span class="num">${intento.calificacion.toFixed(1)}</span><span class="of">DE 100 PTS</span></div></div>
      <h2 style="font-size:19px;">${esc(intento.nombre)}</h2>
      <p class="muted">C.I. ${esc(intento.cedula)} · ${esc(intento.fecha)} · Duración: ${fmtDuration(intento.duracionSeg)}</p>
      <div style="margin-top:10px;">
        <span class="badge ok" style="margin-right:8px;">${nCorrectas} correcta(s)</span>
        <span class="badge bad">${nIncorrectas} incorrecta(s)</span>
      </div>
    </div>
    <div class="card">
      <div class="flex-between">
        <span class="section-label" style="margin-bottom:0;">Informe de retroalimentación · pregunta por pregunta</span>
        <button class="btn btn-ghost btn-sm no-print" id="btnImprimir">🖨 Imprimir / Guardar PDF</button>
      </div>
      <div style="margin-top:12px;">
        ${revisadas.map(({preg,r,ok},i)=>`<div class="qa-review ${ok?'correct':'incorrect'}">
            <div class="qtext">${i+1}. ${esc(preg.texto)} <span class="pill" style="margin-left:6px;">${ok?'✓ Correcta':'✗ Incorrecta'} · ${ok?preg.puntos:0}/${preg.puntos} pts</span></div>
            <div class="arow">Su respuesta: <b>${esc(r.respuesta||'(sin responder)')}</b></div>
            <div class="arow">Respuesta correcta: <b>${esc(preg.respuesta)}</b></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="notice info no-print">Su prueba ha sido registrada. Esta ventana ya no permite reenviar respuestas para esta prueba.</div>
  `;
  wrap.appendChild(shell);
  setTimeout(()=>{
    const btn = document.getElementById('btnImprimir');
    if(btn) btn.onclick = ()=> window.print();
  });
  return wrap;
}

/* ===================================================================== */
/* VIEW: ESTUDIANTE — BLOQUEADO (anulado o ya presentado)                */
/* ===================================================================== */
function ViewEstBloqueado(){
  const a = APP.ctx.intentoExistente;
  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader());
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='520px';

  let msg, tipo;
  if(!a){
    msg = 'No fue posible continuar con esta prueba.'; tipo='danger';
  } else if(a.estado==='anulado'){
    msg = 'Su prueba fue anulada: ' + (a.motivoAnulacion || 'salió de la aplicación durante el examen.') + ' Su calificación registrada es 0. Este código ya no está disponible para su cédula. Contacte a su docente si considera que hubo un error.';
    tipo='danger';
  } else if(a.estado==='finalizado'){
    msg = `Usted ya presentó esta prueba el ${esc(a.fecha)} a las ${esc(a.horaInicio)}. Su calificación registrada es ${a.calificacion!=null?a.calificacion.toFixed(1):'—'} / 100. Solo se permite un intento por prueba.`;
    tipo='warn';
  } else {
    msg = 'Ya existe un intento en curso registrado con su cédula para esta prueba.'; tipo='warn';
  }

  shell.innerHTML = `
    <div class="card">
      <span class="section-label">Acceso no disponible</span>
      <div class="notice ${tipo}" style="margin-top:10px;">${msg}</div>
      <button class="btn btn-ghost btn-block" id="btnVolver" style="margin-top:16px;">Volver al inicio</button>
    </div>
  `;
  wrap.appendChild(shell);
  setTimeout(()=>{
    document.getElementById('btnVolver').onclick = ()=>{ APP.view='home'; APP.ctx={}; render(); };
  });
  return wrap;
}

/* =============================== bootstrap =============================== */
async function storageSelfCheck(){
  try{
    if(!window.storage) return false;
    const testKey = '__selftest__' + Date.now();
    const w = await window.storage.set(testKey, 'ok', true);
    if(!w) return false;
    const r = await window.storage.get(testKey, true);
    stDelete(testKey);
    return !!(r && r.value === 'ok');
  }catch(e){
    console.error('Autoprueba de almacenamiento falló:', e);
    return false;
  }
}

function pintarErrorAlmacenamiento(){
  document.getElementById('app').innerHTML = `
    <div style="max-width:640px; margin:60px auto; padding:0 20px;">
      <div class="notice danger" style="padding:22px;">
        <h3 style="margin-bottom:10px; color:#7A231A;">No se pudo guardar información en este navegador</h3>
        <p style="margin-bottom:10px;">La aplicación no logró escribir datos de prueba en este navegador. Esto ocurre normalmente por una de estas causas:</p>
        <ul>
          <li>Está abriendo el archivo con doble clic (dirección que empieza con <span class="mono">file://</span>). Algunos navegadores, sobre todo en equipos con perfil empresarial/gestionado (como el que se ve en su captura: "Finalizar actualización", cuenta corporativa), bloquean el almacenamiento local para archivos abiertos así.</li>
          <li>Modo incógnito o configuración de privacidad que bloquea el almacenamiento local del sitio.</li>
        </ul>
        <p style="margin-top:12px;"><b>Soluciones recomendadas, de más simple a más robusta:</b></p>
        <ul>
          <li><b>Opción rápida:</b> pruebe abrir el archivo en un navegador distinto (por ejemplo, en una ventana de Chrome sin perfil corporativo, o en Firefox/Edge) y revise que no esté en modo incógnito.</li>
          <li><b>Opción recomendada para pruebas locales:</b> en vez de doble clic, sirva la carpeta con un servidor local. Con Python instalado, abra una terminal en la carpeta del archivo y ejecute <span class="mono">python -m http.server</span>, luego abra <span class="mono">http://localhost:8000</span> en el navegador.</li>
          <li><b>Opción recomendada para uso real con estudiantes:</b> configure Firebase siguiendo el README.md incluido y pruebe la app ya publicada en su sitio (Netlify, Vercel o GitHub Pages). Ahí este problema no ocurre.</li>
        </ul>
      </div>
    </div>`;
}

(async function init(){
  const ok = await storageSelfCheck();
  if(!ok){
    pintarErrorAlmacenamiento();
    return;
  }
  const hash = location.hash || '';
  const m = hash.match(/codigo=([A-Za-z0-9-]+)/);
  if(m){
    APP.ctx.codigoPrellenado = decodeURIComponent(m[1]).toUpperCase();
    APP.view = 'estAcceso';
  }
  render();
})();
</script>
